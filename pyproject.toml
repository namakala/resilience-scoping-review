[project]
name = "resilience-scoping-review"
requires-python = ">=3.11"
dependencies = [
    "rank-bm25>=0.2.2",
]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
