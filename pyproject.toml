[project]
name = "resilience-scoping-review"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "groq>=1.2.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "questionary>=2.0.0",
    "rank-bm25>=0.2.2",
    "rich>=13.0.0",
    "textual>=1.0.0",
]

[project.scripts]
analyze = "analyze:main"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
